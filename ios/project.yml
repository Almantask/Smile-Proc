name: SmileProc
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    AD_HOC_CODE_SIGNING_ALLOWED: "YES"
    PROVISIONING_PROFILE_SPECIFIER: ""
    GENERATE_INFOPLIST_FILE: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  SmileCore:
    path: SmileCore
targets:
  SmileProc:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - SmileProc.entitlements
      - path: Shared
      - path: ../spec/content
        includes:
          - "*.json"
        buildPhase: resources
    dependencies:
      - package: SmileCore
        product: SmileCore
      - target: SmileProcWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smileproc
        PRODUCT_NAME: SmileProc
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SmileProc.entitlements
  SmileProcWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - SmileProcWidgets.entitlements
      - path: Shared
      - path: App/Resources/Localizable.xcstrings
    dependencies:
      - package: SmileCore
        product: SmileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smileproc.widgets
        PRODUCT_NAME: SmileProcWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/SmileProcWidgets.entitlements
  SmileProcUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SmileProcUITests
    dependencies:
      - target: SmileProc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smileproc.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: SmileProc
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
schemes:
  SmileProc:
    build:
      targets:
        SmileProc: all
        SmileProcWidgets: all
        SmileProcUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SmileProcUITests
    archive:
      config: Release
